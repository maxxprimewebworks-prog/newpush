<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Creating input element using createElement method
        let input = document.createElement('input');
        input.type = 'date';
        input.disabled = true;
        input.size = 100;
        document.body.appendChild(input);
    </script>
</body>
</html>
