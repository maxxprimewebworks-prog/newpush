<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-6">

    <main class="w-full max-w-lg">

        <!-- Form -->
        <section class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">

            <div class="mb-8">
                <p class="text-sm font-semibold text-indigo-600 mb-2">
                    USER MANAGER
                </p>

                <h1 class="text-3xl font-bold text-slate-900">
                    Create a new user
                </h1>

                <p class="text-slate-500 mt-2">
                    Enter the user's information below.
                </p>
            </div>


            <form id="userForm" class="space-y-5">

                <!-- Name -->
                <div>
                    <label
                        for="name"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Full name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Leanne Graham"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>


                <!-- Username -->
                <div>
                    <label
                        for="username"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="e.g. leanne_graham"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>


                <!-- Email -->
                <div>
                    <label
                        for="email"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. leanne@example.com"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>


                
                <div>
                    <label
                        for="street"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Street
                    </label>

                    <input
                        type="text"
                        id="street"
                        name="street"
                        placeholder="e.g. 123 Main St"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>

                <div>
                    <label
                        for="suite"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Suite
                    </label>

                    <input
                        type="text"
                        id="suite"
                        name="suite"
                        placeholder="Apt. 556"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>

                <div>
                    <label
                        for="city"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="e.g. New York"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>

                 <div>
                    <label
                        for="phone"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                        Phone no.
                    </label>

                    <input
                        type="number"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 123-456-7890"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>


                <div>
                    <label
                        for="website"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                           Website 
                    </label>

                    <input
                        type="url"
                        id="website"
                        name="website"
                        placeholder="e.g. https://example.com"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>

                <div>
                    <label
                        for="coname"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                       Company Name      
                    </label>

                    <input
                        type="text"
                        id="coname"
                        name="coname"
                        placeholder="e.g. Example Corp"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>

                <div>
                    <label
                        for="caphrase"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                       Catch Phrase     
                    </label>

                    <input
                        type="text"
                        id="caphrase"
                        name="caphrase"
                        placeholder="e.g. Multi-layered client-server neural-net"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>


                <div>
                    <label
                        for="bes"
                        class="block text-sm font-medium text-slate-700 mb-2"
                    >
                       BS     
                    </label>

                    <input
                        type="text"
                        id="bes"
                        name="bes"
                        placeholder="harness real-time e-markets"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
                    >
                </div>



                <!-- Message -->
                <div
                    id="message"
                    class="hidden rounded-lg px-4 py-3 text-sm"
                ></div>



                </div>

                


                <!-- Button -->
                <button
                    type="submit"
                    class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700"
                >
                    Add user
                </button>

            </form>

        </section>


        <!-- Users -->
        <section class="mt-8">

            <div class="flex items-center justify-between mb-4">

                <div>
                    <h2 class="text-xl font-bold text-slate-900">
                        Users
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">
                        Data loaded from JSONPlaceholder
                    </p>
                </div>

                <span
                    id="userCount"
                    class="text-sm text-slate-500"
                >
                    0 users
                </span>

            </div>


            <!--
                Users table:
                CSS Grid gives us clear columns while still allowing the table
                to scroll horizontally on smaller screens.
            -->
           <div class="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-sm">
    <table class="min-w-[1500px] w-max table-fixed">
        <thead class="bg-slate-100">
            <tr>
                <th class="w-[140px] px-4 py-3 text-left text-sm font-semibold">Name</th>
                <th class="w-[120px] px-4 py-3 text-left text-sm font-semibold">Username</th>
                <th class="w-[200px] px-4 py-3 text-left text-sm font-semibold">Email</th>
                <th class="w-[140px] px-4 py-3 text-left text-sm font-semibold">Street</th>
                <th class="w-[130px] px-4 py-3 text-left text-sm font-semibold">Suite</th>
                <th class="w-[130px] px-4 py-3 text-left text-sm font-semibold">City</th>
                <th class="w-[180px] px-4 py-3 text-left text-sm font-semibold">Phone</th>
                <th class="w-[170px] px-4 py-3 text-left text-sm font-semibold">Website</th>
                <th class="w-[180px] px-4 py-3 text-left text-sm font-semibold">Company</th>
                <th class="w-[220px] px-4 py-3 text-left text-sm font-semibold">Catch Phrase</th>
                <th class="w-[180px] px-4 py-3 text-left text-sm font-semibold">BS</th>
            </tr>
        </thead>

        <tbody id="users">
            <!-- JavaScript inserts users here -->
        </tbody>
    </table>
</div>

        </section>

    </main>


    <script>

        const API_URL = "https://jsonplaceholder.typicode.com/users";


        const usersContainer = document.getElementById("users");
        const userCount = document.getElementById("userCount");
        const userForm = document.getElementById("userForm");
        const message = document.getElementById("message");
const street = document.getElementById("street");
const suite = document.getElementById("suite");
const city = document.getElementById("city");
const phone = document.getElementById("phone");
const website = document.getElementById("website");
const caphrase = document.getElementById("caphrase");
const coname = document.getElementById("coname");
const bes = document.getElementById("bes");



        // GET USERS
      async function getUsers() {
    try {
        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to fetch users");
        }

        const users = await response.json();

        usersContainer.innerHTML = "";

        users.forEach(user => {
            usersContainer.innerHTML += createUserRow(user);
        });

        userCount.textContent = `${users.length} users`;

    } catch (error) {
        console.error(error);

        usersContainer.innerHTML = `
            <tr>
                <td colspan="11" class="p-6 text-center text-red-600">
                    Unable to load users.
                </td>
            </tr>
        `;
    }
}
        // Creates one CSS Grid row for a user.
        // Optional chaining prevents errors if nested data is missing.
       function createUserRow(user) {
    return `
        <tr class="border-b border-slate-200 hover:bg-slate-50">

            <td class="px-4 py-4 text-sm text-slate-800 break-words">
                ${user.name ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                @${user.username ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.email ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.address?.street ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.address?.suite ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.address?.city ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.phone ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.website ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.company?.name ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.company?.catchPhrase ?? ""}
            </td>

            <td class="px-4 py-4 text-sm text-slate-600 break-words">
                ${user.company?.bs ?? ""}
            </td>

        </tr>
    `;
}
        // POST USER
        userForm.addEventListener("submit", async (event) => {

            event.preventDefault();


            const name = document.getElementById("name").value;
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
const street = document.getElementById("street").value;
const suite = document.getElementById("suite").value;
const city = document.getElementById("city").value;
const phone = document.getElementById("phone").value;
const website = document.getElementById("website").value;
const coname = document.getElementById("coname").value;
const caphrase = document.getElementById("caphrase").value;
const bes = document.getElementById("bes").value;


            // Build the object using the same nested structure as the API.
            const newUser = {
                name: name,
                username: username,
                email: email,
                phone: phone,
                website: website,

                address: {
                    street: street,
                    suite: suite,
                    city: city
                },

                company: {
                    name: coname,
                    catchPhrase: caphrase,
                    bs: bes
                }
            };

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(newUser)

            });


            const createdUser = await response.json();



console.log("New user:", createdUser);

            // Add the newly created user to the table.
            usersContainer.innerHTML += createUserRow(createdUser);

            // Count the table rows, excluding the header row.
            const currentUsers = usersContainer.children.length - 1;

            userCount.textContent = `${currentUsers} users`;

            // Show message
            message.textContent = "User added successfully!";
            message.className =
                "rounded-lg bg-green-50 border border-green-200 text-green-700 px-4 py-3 text-sm";


            // Clear form
            userForm.reset();

        });


        // Load users when page opens
        getUsers();

    </script>

</body>

</html>
