<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     function getBack() {
        history.back();
     }   

      function getForward() {
        history.forward();
     } 
    </script>
    <a href="https://www.bbc.com">BBC</a><a href="https://www.abc.com">ABC</a><a href="https://www.fbc.com">Click me</a>
    <button type="button" onclick="getBack();">Get Back</button>
    <button type="button" onclick="getForward();">Get Forward</button>
</body>
</html>
